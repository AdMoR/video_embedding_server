version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  video-embedding-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-embedding-server:latest
    container_name: video-embedding-server
    depends_on:
      - qdrant
    
    # NO GPU sections - removed deploy.resources and devices
    
    environment:
      # Force CPU-only execution
      - JAX_PLATFORM_NAME=cpu
      - CUDA_VISIBLE_DEVICES=
      # Qdrant connection
      - EMBEDDINGS_FOLDER=/app/data/embeddings
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    
    volumes:
      - /media/amor/data1/Downloads/CPS/fred_voice_clips_embeddings/:/app/data/embeddings
      - huggingface-cache:/root/.cache/huggingface
    
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"

volumes:
  huggingface-cache:
  qdrant_data:

