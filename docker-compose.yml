version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  video-embedding-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-embedding-server:latest
    container_name: video-embedding-server
    depends_on:
      - qdrant
    
    # GPU support - requires NVIDIA Container Toolkit
    # Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Use 'all' for all GPUs, or specify a number like 1
              capabilities: [gpu]
    devices:
      - /dev/nvidia0:/dev/nvidia0
    
    # Alternative GPU syntax (for older docker-compose versions)
    # runtime: nvidia
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TF_FORCE_GPU_ALLOW_GROWTH=true
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
      # Uncomment to use pre-computed embeddings (faster startup)
      - EMBEDDINGS_FOLDER=/app/data/embeddings
      # Qdrant connection
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    
    volumes:
      # Mount for input videos (optional - adjust path as needed)
      - /media/amor/data1/Downloads/CPS/fred_voice_clips_embeddings/:/app/data/embeddings
      # Mount for model cache (speeds up subsequent runs)
      - huggingface-cache:/root/.cache/huggingface
    
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    
    ports:
      - "8000:8000"

volumes:
  huggingface-cache:
  qdrant_data:
