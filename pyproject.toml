[project]
name = "video-caption-server"
version = "0.1.0"
description = "Video caption-based search server (Marlin-2B + EmbeddingGemma)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11",
    "transformers>=5.7",
    "torchcodec",
    "qwen-vl-utils>=0.0.14",
    "av",
    "pillow",
    "sentence-transformers",
    "huggingface-hub>=0.36.0",
    "numpy>=1.26",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.0",
    "opencv-python>=4.11.0.86",
    "qdrant-client>=1.16.2",
    "boto3>=1.42.31",
    "tqdm>=4.66",
    "accelerate>=1.13.0",
    "causal-conv1d",
    "flash-linear-attention",
    "torchvision>=0.27.0",
    "bitsandbytes>=0.49.2",
]

[project.optional-dependencies]
dependencies = [
    "face-recognition>=1.3.0"
]

[tool.uv.sources]
causal-conv1d = { git = "https://github.com/Dao-AILab/causal-conv1d" }
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention" }
